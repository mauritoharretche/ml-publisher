{% if error %}<p class="error">{{ error }}</p>{% elif suggestions %}<div class="suggestions"><h3>Categorías sugeridas</h3>{% for suggestion in suggestions %}<button type="button" class="suggestion" hx-get="{% url 'drafts:category_attributes' %}?category_id={{ suggestion.category_id }}" hx-target="#category-attributes" hx-on::after-request="document.getElementById('id_category_id').value='{{ suggestion.category_id }}'; document.getElementById('id_domain_id').value='{{ suggestion.domain_id }}'; if (!document.getElementById('id_family_name').value) document.getElementById('id_family_name').value=document.getElementById('id_title').value">{{ suggestion.category_name }} <small>({{ suggestion.category_id }})</small></button>{% endfor %}</div>{% else %}<p>No se encontraron sugerencias.</p>{% endif %}
