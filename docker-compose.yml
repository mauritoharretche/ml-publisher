services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ml_publisher}
      POSTGRES_USER: ${POSTGRES_USER:-ml_publisher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ml_publisher}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-ml_publisher}
      POSTGRES_USER: ${POSTGRES_USER:-ml_publisher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ml_publisher}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-5242880}
      MERCADO_LIBRE_CLIENT_ID: ${MERCADO_LIBRE_CLIENT_ID:-}
      MERCADO_LIBRE_CLIENT_SECRET: ${MERCADO_LIBRE_CLIENT_SECRET:-}
      # Sin una URI HTTPS registrada no se puede iniciar OAuth. No usar un
      # callback local de respaldo: Mercado Libre exige coincidencia exacta.
      MERCADO_LIBRE_REDIRECT_URI: ${MERCADO_LIBRE_REDIRECT_URI:-}
      MERCADO_LIBRE_ENCRYPTION_KEY: ${MERCADO_LIBRE_ENCRYPTION_KEY:-}
      MERCADO_LIBRE_TIMEOUT: ${MERCADO_LIBRE_TIMEOUT:-10}
      MERCADO_LIBRE_ENABLE_TEST_WRITES: ${MERCADO_LIBRE_ENABLE_TEST_WRITES:-false}
      MERCADO_LIBRE_TEST_SELLER_ID: ${MERCADO_LIBRE_TEST_SELLER_ID:-}
    volumes: [.:/app]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
